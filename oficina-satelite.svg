<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Radar circle / Proximity ring -->
  <circle cx="850" cy="337" r="240" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
  <circle cx="850" cy="337" r="160" fill="none" stroke="#10B981" stroke-width="2" opacity="0.5" />
  <circle cx="850" cy="337" r="80" fill="url(#radarGrad)" stroke="#10B981" stroke-width="2.5" />

  <!-- Left Side: Office Building Architecture Graphic -->
  <g transform="translate(120, 160)">
    <!-- Building base -->
    <rect x="0" y="80" width="380" height="280" rx="16" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <rect x="0" y="80" width="380" height="40" rx="16" fill="#334155" />
    <text x="20" y="106" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC" letter-spacing="1.5">METRIKA • CENTRO DE OPERACIONES SATÉLITE</text>

    <!-- Dispatch screens inside building -->
    <rect x="25" y="140" width="155" height="95" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="35" y="165" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38BDF8">TELEMETRÍA FLOTA</text>
    <polyline points="35,210 60,195 85,202 110,180 135,190 160,175" fill="none" stroke="#10B981" stroke-width="2" />
    <circle cx="160" cy="175" r="3" fill="#10B981" />

    <rect x="200" y="140" width="155" height="95" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="210" y="165" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#F59E0B">DESPACHO &amp; ÓRDENES</text>
    <rect x="210" y="180" width="135" height="8" rx="4" fill="#334155" />
    <rect x="210" y="180" width="105" height="8" rx="4" fill="#10B981" />
    <text x="210" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">83/83 OPERATIVAS</text>
    <text x="210" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Disponibilidad 99.2%</text>

    <!-- Meeting room & Technical staging -->
    <rect x="25" y="250" width="330" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1" />
    <text x="40" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#E2E8F0">ÁREA TÉCNICA, SALA DE JUNTAS &amp; REFACCIONES</text>
    <text x="40" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Base de operaciones alterna a menos de 5 min de Planta Milwaukee</text>
    <text x="40" y="315" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#10B981">✓ Sin invadir espacio productivo del cliente si así se requiere</text>
  </g>

  <!-- Right Side: Logistics Proximity Map Node -->
  <!-- Target Pin: Milwaukee Tool Plantas -->
  <g transform="translate(850, 337)">
    <circle cx="0" cy="0" r="14" fill="#EF4444" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="14;45;60" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="25" y="6" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">PLANTAS MILWAUKEE</text>
    <text x="25" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Golden • Planta 1 • Planta 2</text>
  </g>

  <!-- Satellite Hub Pin -->
  <g transform="translate(710, 200)">
    <line x1="0" y1="0" x2="140" y2="137" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-170" y="-35" width="160" height="48" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <text x="-160" y="-18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">OFICINA SATÉLITE</text>
    <text x="-160" y="-3" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">&lt; 5 min de respuesta</text>
  </g>

  <!-- Floating Badge: Tiempo de Respuesta -->
  <g transform="translate(730, 480)">
    <rect x="0" y="0" width="360" height="65" rx="14" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2" />
    <text x="25" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">TIEMPO MÁXIMO DE RESPUESTA EN RUTA</text>
    <text x="25" y="50" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">&lt; 15 a 30 MINUTOS GARANTIZADOS</text>
  </g>

  <!-- Title Top Banner -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="460" height="34" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" />
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F59E0B" letter-spacing="1">INFRAESTRUCTURA FLEXIBLE • CENTRO LOGÍSTICO CERCANO</text>
  </g>
</svg>
